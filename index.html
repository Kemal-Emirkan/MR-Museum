<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MR Museum - Final TP Setup</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .title-box { background-color: #222; color: white; padding: 20px 40px; border-radius: 8px; margin-bottom: 30px; text-align: center; }
        .title-box h1 { margin: 0; font-size: 3rem; text-transform: uppercase; }
        .button-container { display: flex; gap: 20px; }
        .start-btn { background-color: #444; color: white; border: 2px solid #666; padding: 15px 30px; font-size: 1.2rem; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .start-btn:hover { background-color: #ffd700; color: black; border-color: #ffd700; transform: scale(1.05); }
        
        /* WEB MAP */
        #open-map-btn { position: fixed; top: 20px; right: 20px; z-index: 1000; background: rgba(0, 0, 0, 0.6); color: white; border: 1px solid white; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; display: none; }
        #map-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5000; display: none; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); justify-content: center; align-items: center; flex-direction: column; }
        .map-container { position: relative; width: 80%; max-width: 1200px; aspect-ratio: 16/9; background-size: cover; background-position: center; border: 5px solid #333; border-radius: 10px; background-color: #111; }
        .floor-switch { display: flex; gap: 10px; margin-bottom: 15px; }
        .floor-btn { background: #333; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        .floor-btn.active { background: #ffd700; color: black; font-weight: bold; }
        .close-map { margin-top: 15px; background: transparent; color: white; border: 1px solid white; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        .map-pin { position: absolute; width: 20px; height: 20px; background-color: #ff3333; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 10; }
        .map-pin:hover { background-color: #ffd700; transform: translate(-50%, -50%) scale(1.5); z-index: 20; }
        .map-pin::after { content: attr(data-label); position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 5px 10px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; }
        .map-pin:hover::after { opacity: 1; }
    </style>

    <script>
    // --- DATENBANK FÜR INFO TEXTE ---
    const deviceContent = {
        'rift-cv1': { title: 'Oculus Rift CV1', maker: 'Oculus VR (Facebook)', year: '2016', text: 'Die erste kommerzielle Version der Oculus Rift. Sie markierte den Beginn der modernen VR-Aera für Konsumenten.' },
        'quest1':   { title: 'Oculus Quest', maker: 'Oculus (Meta)', year: '2019', text: 'Das erste autarke 6DOF-Headset, das keine Kabel oder externen Sensoren mehr benoetigte.' },
        'quest2':   { title: 'Meta Quest 2', maker: 'Meta', year: '2020', text: 'Ein massiver Erfolg im Massenmarkt durch guenstigen Preis und hohe Aufloesung. Brachte VR zu Millionen von Nutzern.' },
        'quest3':   { title: 'Meta Quest 3', maker: 'Meta', year: '2023', text: 'Der aktuelle Standard für Mixed Reality. Mit Farb-Passthrough und Pancake-Linsen für ein schaerferes Bild.' },

        'daydream': { title: 'Google Daydream', maker: 'Google', year: '2016', text: 'Googles Versuch einer hochwertigen mobilen VR-Plattform mit Stoffbezug und kleinem Controller.' },
        'hololens': { title: 'Microsoft HoloLens', maker: 'Microsoft', year: '2016', text: 'Die erste eigenstaendige holografische Computerbrille, die echte Mixed Reality im Business-Bereich ermoeglichte.' },
        'valve':    { title: 'Valve Index', maker: 'Valve', year: '2019', text: 'Bekannt für High-End-Audio und die revolutionären Knuckles-Controller mit Fingertracking.' },
        'avp':      { title: 'Apple Vision Pro', maker: 'Apple', year: '2024', text: 'Apples Einstieg in das "Spatial Computing". Extrem hohe Aufloesung und Steuerung nur durch Augen und Haende.' },
        'psvr':     { title: 'PlayStation VR', maker: 'Sony', year: '2016', text: 'Brachte VR auf die PlayStation 4. Trotz veralteter Tracking-Technik extrem erfolgreich.' },
        'vive':     { title: 'HTC Vive', maker: 'HTC / Valve', year: '2016', text: 'Pionier des Room-Scale VR. Mit den Lighthouse-Basisstationen war praezises Bewegen im Raum moeglich.' },
        'vivepro':  { title: 'HTC Vive Pro', maker: 'HTC', year: '2018', text: 'Das Upgrade für professionelle Nutzer mit besserer Aufloesung und integrierten Kopfhoerern.' },
        'bild1':    { title: 'The Sword of Damocles', maker: 'Ivan Sutherland', year: '1968', text: 'Das erste VR/AR-System. Es war so schwer, dass es an der Decke befestigt werden musste, was ihm seinen bedrohlichen Namen gab.' }, 
        'bild2':    { title: 'Sega VR', maker: 'Sega', year: '1993', text: 'Ein geplantes VR-Add-on fuer die Sega Genesis. Es wurde nie veroeffentlicht, da Sega Bedenken bezueglich Uebelkeit und Kopfschmerzen bei Testern hatte.' }, 
        'bild3':    { title: 'Virtual Boy', maker: 'Nintendo', year: '1995', text: 'Nintendos erster Versuch einer "tragbaren" 3D-Konsole. Bekannt für das rote, monochrome Display und den kommerziellen Misserfolg.' } 
    };

    // --- COMPONENTS ---

    AFRAME.registerComponent('debug-manager', {
        init: function () {
            this.isDebug = false;
            const cam = document.querySelector('[camera]');
            cam.setAttribute('wasd-controls', 'enabled: false');
            window.addEventListener('keydown', (e) => {
                if (e.key === '*') {
                    this.isDebug = !this.isDebug;
                    cam.setAttribute('wasd-controls', `enabled: ${this.isDebug}`);
                    if (this.isDebug) this.el.sceneEl.addState('debug');
                    else this.el.sceneEl.removeState('debug');
                    console.log("Debug Mode:", this.isDebug);
                }
                
                if (this.isDebug && e.key.toLowerCase() === 'b') {
                    const arMgr = this.el.sceneEl.components['ar-manager'];
                    if (arMgr) arMgr.toggleAR();
                }
            });
        }
    });

    AFRAME.registerComponent('coordinate-logger', {
        init: function () {
            window.addEventListener('keydown', (e) => {
                if (!this.el.sceneEl.is('debug')) return;
                if (e.key.toLowerCase() === 'c') {
                    const cam = document.querySelector('[camera]');
                    const worldPos = new THREE.Vector3();
                    cam.object3D.getWorldPosition(worldPos);
                    const camRot = cam.getAttribute('rotation');
                    const rigRot = document.querySelector('#rig').getAttribute('rotation');
                    const totalY = (camRot.y + rigRot.y).toFixed(0);
                    console.log(`pos: "${worldPos.x.toFixed(2)} ${worldPos.y.toFixed(2)} ${worldPos.z.toFixed(2)}"; rot: "0 ${totalY} 0"`);
                }
            });
        }
    });

    AFRAME.registerComponent('tour-manager', {
        init: function () {
            this.points = [
                { pos: "35.83 6.80 0.06",   rot: "0 -92 0" }, { pos: "30.44 6.80 -12.19", rot: "0 -59 0" },
                { pos: "20.59 6.80 -30.67", rot: "0 -60 0" }, { pos: "5.85 6.80 -55.37",  rot: "0 -65 0" },
                { pos: "-42.84 6.80 -5.14", rot: "0 83 0" },  { pos: "-41.47 6.80 26.00", rot: "0 97 0" },
                { pos: "-33.14 6.80 50.55", rot: "0 114 0" }, { pos: "36.25 22.60 0.18",  rot: "0 270 0" },
                { pos: "31.13 22.60 -12.43",rot: "0 301 0" }, { pos: "20.83 22.60 -30.48",rot: "0 301 0" },
                { pos: "16.56 22.60 -18.06",rot: "0 500 0" }, { pos: "-23.82 22.60 -17.73",rot: "0 580 0" },
                { pos: "-28.62 6.80 -31.76",rot: "0 719 0" }, { pos: "7.93 22.60 -52.46", rot: "0 660 0" },
                { pos: "-40.87 22.60 -4.57",rot: "0 806 0" }
            ];
            this.index = -1;
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 't') {
                    this.index = (this.index + 1) % this.points.length;
                    const p = this.points[this.index];
                    const rig = document.querySelector('#rig');
                    rig.setAttribute('position', p.pos);
                    rig.setAttribute('rotation', p.rot);
                }
            });
        }
    });

    AFRAME.registerComponent('auto-rotate-when-near', {
        schema: {
            triggerPos: {type: 'vec3'}, 
            baseRot: {type: 'vec3'}     
        },
        init: function () {
            this.rig = document.querySelector('#rig');
            this.isRotating = false;
        },
        tick: function (time, timeDelta) {
            if (this.el.sceneEl.is('ar-mode')) return;

            const rigPos = this.rig.getAttribute('position');
            const dist = new THREE.Vector3(rigPos.x, rigPos.y, rigPos.z).distanceTo(this.data.triggerPos);

            if (dist < 2.0) {
                this.el.object3D.rotation.y += 0.0005 * timeDelta; 
                this.isRotating = true;
            } 
            else if (this.isRotating) {
                this.el.setAttribute('rotation', this.data.baseRot);
                this.isRotating = false;
            }
        }
    });

    AFRAME.registerComponent('info-panel', {
        schema: {
            id: {type: 'string'},       
            triggerPos: {type: 'vec3'}  
        },
        init: function () {
            this.rig = document.querySelector('#rig');
            this.camera = document.querySelector('[camera]');
            this.targetVec = new THREE.Vector3(); 
            this.panelId = this.data.id; 
            
            const data = deviceContent[this.data.id]; 
            if (!data) return; 

            this.el.setAttribute('visible', false);
            this.el.classList.add('info-panel-entity'); 

            const bg = document.createElement('a-plane');
            bg.setAttribute('color', '#111');
            bg.setAttribute('opacity', '0.8');
            bg.setAttribute('width', '3.0');
            bg.setAttribute('height', '1.6');
            bg.setAttribute('position', '0 0 0');
            this.el.appendChild(bg);

            const title = document.createElement('a-text');
            title.setAttribute('value', data.title);
            title.setAttribute('color', '#ffd700');
            title.setAttribute('align', 'center');
            title.setAttribute('position', '0 0.6 0.01'); 
            title.setAttribute('width', '6'); 
            this.el.appendChild(title);

            const meta = document.createElement('a-text');
            meta.setAttribute('value', `${data.maker} | ${data.year}`);
            meta.setAttribute('color', '#ccc');
            meta.setAttribute('align', 'center');
            meta.setAttribute('position', '0 0.4 0.01');
            meta.setAttribute('width', '4');
            this.el.appendChild(meta);

            const text = document.createElement('a-text');
            text.setAttribute('value', data.text);
            text.setAttribute('color', 'white');
            text.setAttribute('align', 'center');
            text.setAttribute('position', '0 -0.1 0.01');
            text.setAttribute('width', '2.6'); 
            text.setAttribute('wrap-count', '32');
            this.el.appendChild(text);
        },
        tick: function () {
            if (this.el.sceneEl.is('ar-mode')) return;

            const rigPos = this.rig.getAttribute('position');
            const dist = new THREE.Vector3(rigPos.x, rigPos.y, rigPos.z).distanceTo(this.data.triggerPos);

            if (dist < 2.5) {
                if (!this.el.getAttribute('visible')) this.el.setAttribute('visible', true);
                this.camera.object3D.getWorldPosition(this.targetVec);
                this.el.object3D.lookAt(this.targetVec);
            } else {
                if (this.el.getAttribute('visible')) this.el.setAttribute('visible', false);
            }
        }
    });

    // --- AGGRESSIVE AR MANAGER (Smart Switch) ---
    AFRAME.registerComponent('ar-manager', {
        init: function () {
            this.inAR = false;
            this.activeObject = null;
            this.activePanel = null;
            this.originalState = { pos: null, rot: null, scale: null };
            this.originalPanelState = { pos: null, rot: null, scale: null };
            this.museumOriginalScale = {x: 1, y: 1, z: 1}; 
            this.lastToggleTime = 0;

            this.rig = document.querySelector('#rig');
            this.camera = document.querySelector('[camera]');
            
            this.skyTexture = null;
            new THREE.TextureLoader().load('assets/Sky.jpg', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                texture.colorSpace = THREE.SRGBColorSpace;
                this.skyTexture = texture;
                
                if (this.el.sceneEl.object3D) {
                    this.el.sceneEl.object3D.environment = this.skyTexture;
                    this.el.sceneEl.object3D.environmentIntensity = 0.8;
                }
            });
        },
        toggleAR: function () {
            const now = Date.now();
            if (now - this.lastToggleTime < 500) return;
            this.lastToggleTime = now;

            if (this.inAR) {
                this.exitAR();
            } else {
                this.enterAR();
            }
        },
        enterAR: function () {
            // --- IN AR MODUS WECHSELN ---
            // Ziel: Wir machen "Löcher" in die VR Welt, damit Passthrough sichtbar wird
            
            const museum = document.getElementById('museum-entity');
            const sky = document.querySelector('a-sky');
            const rings = document.querySelectorAll('a-ring');
            const sceneEl = this.el.sceneEl;

            // 1. HINTERGRUND TRANSPARENT (Damit Passthrough sichtbar wird)
            sceneEl.removeAttribute('background');
            if (sceneEl.renderer) sceneEl.renderer.setClearColor(0x000000, 0); 
            if (sceneEl.object3D) {
                sceneEl.object3D.background = null;
                sceneEl.object3D.environment = null;
            }

            // 2. SKYBOX VERSTECKEN
            if(sky) sky.setAttribute('visible', false);
            rings.forEach(r => r.setAttribute('visible', false));

            // 3. MUSEUM VERSTECKEN
            if(museum) {
                const s = museum.getAttribute('scale');
                if (s) this.museumOriginalScale = {x: s.x, y: s.y, z: s.z};
                museum.setAttribute('scale', '0 0 0');
                museum.setAttribute('visible', false);
                if(museum.object3D) {
                    museum.object3D.visible = false;
                    museum.object3D.traverse((node) => node.visible = false);
                }
            }

            document.querySelectorAll('.info-panel-entity').forEach(p => p.setAttribute('visible', false));
            document.querySelectorAll('.ar-artifact').forEach(a => a.setAttribute('visible', false));

            // 4. ARTEFAKT SUCHEN & HOLEN
            let closest = null;
            let minDst = 999999; 
            const camWorldPos = new THREE.Vector3();
            this.camera.object3D.getWorldPosition(camWorldPos);

            document.querySelectorAll('.ar-artifact').forEach(el => {
                const dist = el.object3D.getWorldPosition(new THREE.Vector3()).distanceTo(camWorldPos);
                if (dist < minDst) {
                    minDst = dist;
                    closest = el;
                }
            });

            if (!closest) {
                const allArtifacts = document.querySelectorAll('.ar-artifact');
                if (allArtifacts.length > 0) closest = allArtifacts[0];
            }

            if (!closest) {
                this.exitAR(); 
                return;
            }

            this.inAR = true;
            this.el.sceneEl.addState('ar-mode');
            this.activeObject = closest;

            const oldPos = closest.getAttribute('position');
            const oldRot = closest.getAttribute('rotation');
            const oldScale = closest.getAttribute('scale');

            this.originalState.pos = {x: oldPos.x, y: oldPos.y, z: oldPos.z};
            this.originalState.rot = {x: oldRot.x, y: oldRot.y, z: oldRot.z};
            this.originalState.scale = {x: oldScale.x, y: oldScale.y, z: oldScale.z};

            // Panel holen
            const panels = document.querySelectorAll('.info-panel-entity');
            let closestPanel = null;
            let minPDst = 1000;
            panels.forEach(p => {
                const d = p.object3D.getWorldPosition(new THREE.Vector3()).distanceTo(camWorldPos);
                if (d < minPDst) { minPDst = d; closestPanel = p; }
            });
            this.activePanel = closestPanel;

            if (this.activePanel) {
                const pPos = this.activePanel.getAttribute('position');
                const pRot = this.activePanel.getAttribute('rotation');
                const pScale = this.activePanel.getAttribute('scale');
                this.originalPanelState.pos = {x: pPos.x, y: pPos.y, z: pPos.z};
                this.originalPanelState.rot = {x: pRot.x, y: pRot.y, z: pRot.z};
                this.originalPanelState.scale = {x: pScale.x, y: pScale.y, z: pScale.z};
            }

            this.activeObject.setAttribute('visible', true);
            if(this.activeObject.object3D) this.activeObject.object3D.visible = true;
            
            const camObj = this.camera.object3D;
            const camWorldDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camObj.getWorldQuaternion(new THREE.Quaternion()));
            camWorldDir.multiplyScalar(1.2); 
            
            const targetPos = camWorldPos.clone().add(camWorldDir);
            targetPos.y = camWorldPos.y - 0.2; 

            this.activeObject.object3D.position.copy(targetPos);
            this.activeObject.object3D.lookAt(camWorldPos);

            if (this.activePanel) {
                this.activePanel.setAttribute('visible', true);
                if(this.activePanel.object3D) this.activePanel.object3D.visible = true;
                const panelOffset = new THREE.Vector3(0, -0.5, 0); 
                const objPos = this.activeObject.object3D.position.clone();
                this.activePanel.object3D.position.copy(objPos).add(panelOffset);
                this.activePanel.object3D.lookAt(camWorldPos);
                this.activePanel.setAttribute('scale', '0.3 0.3 0.3');
            }

            this.activeObject.classList.add('ar-grabbable-target');
        },
        exitAR: function () {
            // --- ZURÜCK ZUM VR MODUS ---
            this.inAR = false;
            this.el.sceneEl.removeState('ar-mode');

            if (this.activeObject) {
                this.activeObject.setAttribute('position', this.originalState.pos);
                this.activeObject.setAttribute('rotation', this.originalState.rot);
                this.activeObject.setAttribute('scale', this.originalState.scale);
                this.activeObject.classList.remove('ar-grabbable-target');
                this.activeObject.setAttribute('visible', true);
            }

            if (this.activePanel) {
                this.activePanel.setAttribute('position', this.originalPanelState.pos);
                this.activePanel.setAttribute('rotation', this.originalPanelState.rot);
                this.activePanel.setAttribute('scale', this.originalPanelState.scale); 
            }

            const museum = document.getElementById('museum-entity');
            const sky = document.querySelector('a-sky');
            const rings = document.querySelectorAll('a-ring');

            if(museum) {
                museum.setAttribute('visible', true);
                museum.setAttribute('scale', this.museumOriginalScale);
                if(museum.object3D) {
                    museum.object3D.visible = true;
                    museum.object3D.traverse((node) => node.visible = true);
                    museum.object3D.scale.set(this.museumOriginalScale.x, this.museumOriginalScale.y, this.museumOriginalScale.z);
                }
            }

            // 1. SKYBOX WIEDER AN (Passthrough wird dadurch verdeckt und geht in Standby)
            if(sky) {
                sky.setAttribute('visible', true);
                sky.setAttribute('scale', '1 1 1');
            }
            rings.forEach(r => r.setAttribute('visible', true));
            
            if (this.skyTexture && this.el.sceneEl.object3D) {
                this.el.sceneEl.object3D.environment = this.skyTexture;
                this.el.sceneEl.object3D.environmentIntensity = 0.8;
            }
            
            document.querySelectorAll('.ar-artifact').forEach(a => {
                a.setAttribute('visible', true);
                if(a.object3D) a.object3D.visible = true;
            });

            this.activeObject = null;
            this.activePanel = null;
        }
    });

    // --- GRAB LOGIK ---
    AFRAME.registerComponent('ar-grab-interaction', {
        init: function () {
            this.grabbed = null;
            this.el.addEventListener('triggerdown', this.onTriggerDown.bind(this));
            this.el.addEventListener('triggerup', this.onTriggerUp.bind(this));
        },
        onTriggerDown: function () {
            if (!this.el.sceneEl.is('ar-mode')) return;

            const arManager = this.el.sceneEl.components['ar-manager'];
            if (!arManager || !arManager.activeObject) return;

            const objectEl = arManager.activeObject;
            const controllerPos = this.el.object3D.getWorldPosition(new THREE.Vector3());
            const objectPos = objectEl.object3D.getWorldPosition(new THREE.Vector3());

            if (controllerPos.distanceTo(objectPos) < 0.8) { 
                this.grabbed = objectEl;
                this.el.object3D.attach(this.grabbed.object3D);
            }
        },
        onTriggerUp: function () {
            if (this.grabbed) {
                this.el.sceneEl.object3D.attach(this.grabbed.object3D);
                this.grabbed = null;
            }
        }
    });

    // --- FIXED CONTROLLER HANDLER ---
    AFRAME.registerComponent('vr-controller-handler', {
        schema: {
            hand: {type: 'string', default: 'right'} 
        },
        init: function () {
            if (this.data.hand === 'left') {
                this.el.addEventListener('ybuttondown', this.toggleVRMap.bind(this));
            }
            if (this.data.hand === 'right') {
                this.el.addEventListener('bbuttondown', (e) => {
                    this.toggleARMode();
                });
            }
            this.mapVisible = false;
            this.tablet = document.querySelector('#vr-tablet');
        },
        toggleVRMap: function () {
            if (this.el.sceneEl.is('ar-mode')) return; // Karte nur in VR

            this.mapVisible = !this.mapVisible;
            if(this.tablet) this.tablet.setAttribute('visible', this.mapVisible);
            const pins = document.querySelectorAll('.vr-map-pin');
            pins.forEach(pin => {
                if(this.mapVisible) pin.classList.add('clickable');
                else pin.classList.remove('clickable');
            });
        },
        toggleARMode: function () {
            const mgr = this.el.sceneEl.components['ar-manager'];
            if (mgr) mgr.toggleAR();
        }
    });

    AFRAME.registerComponent('vr-map-pin-click', {
        schema: { pos: {type: 'vec3'}, rot: {type: 'vec3'} },
        init: function () {
            this.el.addEventListener('click', () => {
                const rig = document.querySelector('#rig');
                rig.setAttribute('position', this.data.pos);
                rig.setAttribute('rotation', this.data.rot);
                const tablet = document.querySelector('#vr-tablet');
                tablet.setAttribute('visible', false);
                const pins = document.querySelectorAll('.vr-map-pin');
                pins.forEach(pin => pin.classList.remove('clickable'));
                
                const leftHand = document.getElementById('leftHand');
                if (leftHand && leftHand.components['vr-controller-handler']) {
                    leftHand.components['vr-controller-handler'].mapVisible = false;
                }
            });
            this.el.addEventListener('mouseenter', () => {
                this.el.setAttribute('color', '#ffd700'); 
                this.el.setAttribute('scale', '1.5 1.5 1.5');
            });
            this.el.addEventListener('mouseleave', () => {
                this.el.setAttribute('color', '#ff3333'); 
                this.el.setAttribute('scale', '1 1 1');
            });
        }
    });

    AFRAME.registerComponent('teleport-to', {
        schema: { pos: {type: 'vec3'}, rot: {type: 'vec3', default: {x: 0, y: 0, z: 0}} },
        init: function () {
            this.el.addEventListener('click', () => {
                const rig = document.querySelector('#rig');
                rig.setAttribute('position', this.data.pos);
                if (this.data.rot.x !== 0 || this.data.rot.y !== 0 || this.data.rot.z !== 0) {
                     rig.setAttribute('rotation', this.data.rot);
                }
            });
        }
    });

    AFRAME.registerComponent('viewer-engine', {
        init: function () {
            const renderer = this.el.sceneEl.renderer;
            const scene = this.el.sceneEl.object3D;
            renderer.toneMapping = THREE.NeutralToneMapping;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            new THREE.TextureLoader().load('assets/Sky.jpg', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                texture.colorSpace = THREE.SRGBColorSpace;
                scene.environment = texture;
                scene.environmentIntensity = 0.8;
            });
        }
    });

    AFRAME.registerComponent('apply-shadows', {
        init: function () {
            this.el.addEventListener('model-loaded', () => {
                const mesh = this.el.getObject3D('mesh');
                if (mesh) mesh.traverse((n) => { if (n.isMesh) { n.castShadow = n.receiveShadow = true; if (n.material) n.material.shadowSide = THREE.DoubleSide; } });
            });
        }
    });

    AFRAME.registerComponent('elevator-controls', {
        init: function () {
            this.speed = 0.2; 
            window.addEventListener('keydown', (e) => {
                if (!this.el.sceneEl.is('debug')) return;
                var pos = this.el.getAttribute('position');
                if (e.key.toLowerCase() === 'e') pos.y += this.speed;
                if (e.key.toLowerCase() === 'q') pos.y -= this.speed;
                this.el.setAttribute('position', pos);
            });
        }
    });
    </script>
</head>

    <script>
        // --- JAVASCRIPT LOGIK ---
        
        const startOverlay = document.getElementById('start-screen');
        const mapOverlay = document.getElementById('map-overlay');
        const mapContainer = document.getElementById('map-container');
        const btnOpenMap = document.getElementById('open-map-btn');
        const btnEG = document.getElementById('btn-eg');
        const btnOG = document.getElementById('btn-og');
        const scene = document.querySelector('a-scene');

        const REF_WIDTH = 1920; 
        const REF_HEIGHT = 1080;

        // Daten für Web UND VR
        const mapData = [
            { floor: 'EG', name: 'Podest 1', px: 1024, py: 715, pos: "35.83 6.80 0.06", rot: "0 -92 0" },
            { floor: 'EG', name: 'Podest 2', px: 1116, py: 667, pos: "30.44 6.80 -12.19", rot: "0 -59 0" },
            { floor: 'EG', name: 'Podest 3', px: 1256, py: 586, pos: "20.59 6.80 -30.67", rot: "0 -60 0" },
            { floor: 'EG', name: 'Podest 4', px: 1447, py: 481, pos: "5.85 6.80 -55.37", rot: "0 -65 0" },
            { floor: 'EG', name: 'Podest 5', px: 1066, py: 96,  pos: "-42.84 6.80 -5.14", rot: "0 83 0" },
            { floor: 'EG', name: 'Podest 6', px: 825,  py: 110, pos: "-41.47 6.80 26.00", rot: "0 97 0" },
            { floor: 'EG', name: 'Podest 7', px: 631,  py: 172, pos: "-33.14 6.80 50.55", rot: "0 114 0" },
            { floor: 'EG', name: 'Bild 1',   px: 1286, py: 222, pos: "-28.62 6.80 -31.76", rot: "0 719 0" },
            { floor: 'OG', name: 'Podest 8', px: 1024, py: 715, pos: "36.25 22.60 0.18", rot: "0 270 0" },
            { floor: 'OG', name: 'Podest 9', px: 1116, py: 667, pos: "31.13 22.60 -12.43", rot: "0 301 0" },
            { floor: 'OG', name: 'Podest 10', px: 1256, py: 586, pos: "20.83 22.60 -30.48", rot: "0 301 0" },
            { floor: 'OG', name: 'Podest 11', px: 1150, py: 552, pos: "16.56 22.60 -18.06", rot: "0 500 0" },
            { floor: 'OG', name: 'Podest 12', px: 1157, py: 253, pos: "-23.82 22.60 -17.73", rot: "0 580 0" },
            { floor: 'OG', name: 'Bild 2',    px: 1434, py: 511, pos: "7.93 22.60 -52.46", rot: "0 660 0" },
            { floor: 'OG', name: 'Bild 3',    px: 1035, py: 93,  pos: "-40.87 22.60 -4.57", rot: "0 806 0" }
        ];

        let currentFloor = 'EG';

        // --- START LOGIK ---
        function startGame() {
            startOverlay.style.display = 'none';
            btnOpenMap.style.display = 'block'; 
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'm') {
                    if (mapOverlay.style.display === 'flex') closeMap();
                    else openMap();
                }
            });
            // Initialisiere VR Pins
            renderVRPins();
        }

        document.getElementById('btn-web').addEventListener('click', startGame);
        document.getElementById('btn-vr').addEventListener('click', () => {
            startGame();
            // WICHTIG: Wir rufen enterVR() auf, NICHT enterAR().
            // Aber wir haben "passthrough" in den optionalFeatures angefordert.
            scene.enterVR();
        });

        // --- WEB MAP FUNKTIONEN ---
        function openMap() {
            mapOverlay.style.display = 'flex';
            renderPins();
        }
        function closeMap() {
            mapOverlay.style.display = 'none';
        }
        function switchFloor(floor) {
            currentFloor = floor;
            if(floor === 'EG') {
                btnEG.classList.add('active'); btnOG.classList.remove('active');
            } else {
                btnEG.classList.remove('active'); btnOG.classList.add('active');
            }
            renderPins();
        }
        function renderPins() {
            if (currentFloor === 'EG') mapContainer.style.backgroundImage = "url('assets/Erdgeschoss.png')";
            else mapContainer.style.backgroundImage = "url('assets/Obergeschoss.png')";
            
            mapContainer.innerHTML = '';
            mapData.forEach(point => {
                if (point.floor === currentFloor) {
                    const pin = document.createElement('div');
                    pin.className = 'map-pin';
                    pin.setAttribute('data-label', point.name); 
                    pin.style.left = (point.px / REF_WIDTH) * 100 + '%';
                    pin.style.top = (point.py / REF_HEIGHT) * 100 + '%';
                    pin.onclick = () => {
                        const rig = document.querySelector('#rig');
                        rig.setAttribute('position', point.pos);
                        rig.setAttribute('rotation', point.rot);
                        closeMap();
                    };
                    mapContainer.appendChild(pin);
                }
            });
        }

        // --- VR MAP FUNKTIONEN ---
        window.switchVRFloor = function(floor) {
            currentFloor = floor;
            const vrMapPlane = document.getElementById('vr-map-plane');
            if (floor === 'EG') vrMapPlane.setAttribute('src', '#map-eg-tex');
            else vrMapPlane.setAttribute('src', '#map-og-tex');
            renderVRPins();
        }

        function renderVRPins() {
            const container = document.getElementById('vr-pins-container');
            container.innerHTML = ''; // Löschen

            const mapWidth3D = 1.0;
            const mapHeight3D = 0.5625;

            mapData.forEach(point => {
                if (point.floor === currentFloor) {
                    const x = (point.px / REF_WIDTH) * mapWidth3D;
                    const y = -((point.py / REF_HEIGHT) * mapHeight3D);

                    const pin = document.createElement('a-circle');
                    pin.setAttribute('radius', '0.02');
                    pin.setAttribute('color', '#ff3333');
                    pin.setAttribute('position', `${x} ${y} 0.01`);
                    pin.setAttribute('class', 'vr-map-pin'); 
                    
                    pin.setAttribute('vr-map-pin-click', {
                        pos: point.pos,
                        rot: point.rot
                    });

                    container.appendChild(pin);
                }
            });
        }
    </script>
</body>
